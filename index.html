<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Estante Widget - Página B (Fix)</title>
    <style>
        /* Manter seus estilos originais */
        :root {
            --shelf-bg: #0d0d0d; --shelf-border: #1a1a1a; --shelf-divider: #252525;
            --shelf-gradient-start: #050505; --shelf-gradient-end: #161616;
            --shelf-shadow-top: rgba(0,0,0,0.2); --text-color: white;
            --panel-bg: #151515; --panel-border: #333; --input-bg: #222;
            --input-border: #444; --input-text: #eee; --tooltip-bg: #000;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --text-color: #1a1a1a; --panel-bg: #ffffff; --panel-border: #d4d4d4;
                --input-bg: #f5f5f5; --input-border: #d4d4d4; --input-text: #1a1a1a;
                --list-item-bg: #fafafa; --tooltip-bg: #333; --tooltip-border: #999;
                --backup-text-bg: #fafafa; --backup-text-color: #1a8a1a;
            }
        }
        html, body { margin: 0; padding: 0; background-color: transparent !important; font-family: 'Segoe UI', sans-serif; color: var(--text-color); }
        .furniture-wrapper { width: 90%; max-width: 420px; margin: 20px auto; display: flex; flex-direction: column; align-items: center; }
        .bookshelf-container { width: 100%; background-color: var(--shelf-bg); border: 15px solid var(--shelf-border); border-bottom: none; border-radius: 6px 6px 0 0; box-shadow: 10px 10px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; position: relative; }
        .shelf-row { height: 130px; border-bottom: 12px solid var(--shelf-divider); display: flex; align-items: flex-end; padding: 0 8px; background: linear-gradient(to bottom, var(--shelf-gradient-start), var(--shelf-gradient-end)); position: relative; overflow: hidden; }
        .shelf-row:last-of-type { border-bottom: none !important; background: transparent !important; }
        .shelf-footer { width: calc(100% + 30px); height: 55px; background: var(--shelf-border); position: relative; margin-top: -1px; z-index: 5; }
        #secret-btn { position: absolute; right: 0; bottom: 0; width: 50px; height: 100%; opacity: 0; cursor: pointer; border: none; background: transparent; }
        .book, a.book-link { margin-right: 1px; background-size: 100% 100%; background-position: center; background-repeat: no-repeat; border-radius: 1px; box-shadow: 2px 0 5px rgba(0,0,0,0.9); transition: transform 0.2s; cursor: pointer; position: relative; flex-shrink: 0; display: block; }
        .book:hover, a.book-link:hover { transform: scale(1.05) translateY(-5px); z-index: 10; }
        
        /* Estilos do Painel */
        #admin-panel { display: none; background: var(--panel-bg); padding: 15px; border-bottom: 2px solid var(--panel-border); position: fixed; top: 0; left: 0; right: 0; z-index: 100; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .input-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        input, textarea { padding: 8px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn-add { background: #388E3C; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
        .list-item { display: flex; justify-content: space-between; padding: 5px; background: var(--list-item-bg); margin-bottom: 5px; border-radius: 4px; font-size: 12px; border: 1px solid var(--panel-border); }
        .btn-trash { background: #d32f2f; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 2px 8px; }
        #status-msg { padding: 10px; margin-bottom: 10px; border-radius: 4px; display: none; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

    <div id="admin-panel">
        <h3>Gerenciar Estante B</h3>
        <div id="status-msg"></div>

        <div class="input-group">
            <input type="text" id="seriesName" placeholder="Nome da Série" style="flex: 2;">
            <input type="number" id="volNumber" placeholder="Vol." style="width: 60px;">
        </div>
        <div class="input-group">
            <input type="text" id="imgUrl" placeholder="URL da Imagem">
            <input type="text" id="pageLink" placeholder="Link da Página (Opcional)">
        </div>
        <div class="input-group">
            <input type="number" id="bookHeightCm" placeholder="Alt (cm)" value="19" step="0.1" style="width: 80px;">
            <input type="number" id="bookWidthCm" placeholder="Esp (cm)" value="1.5" step="0.1" style="width: 80px;">
            <button class="btn-add" onclick="addBook()">Adicionar</button>
            <button class="btn-add" style="background:#666" onclick="togglePanel()">Fechar</button>
        </div>

        <div id="book-list-container">
            <h4>LIVROS CADASTRADOS:</h4>
            <div id="active-book-list"></div>
        </div>

        <div style="margin-top:20px; border-top: 1px solid #444; padding-top:10px;">
            <label style="font-size: 11px;">CÓDIGO DE BACKUP (BASE64):</label>
            <textarea id="backupText" readonly onclick="this.select()" placeholder="Clique em Gerar..."></textarea>
            <button class="btn-add" style="background:#2196F3; width:100%; margin: 5px 0;" onclick="generateBackupCode()">Gerar e Copiar Código</button>
            <button class="btn-add" style="background:#FF9800; width:100%;" onclick="restoreBackupCode()">Restaurar Código Colado</button>
        </div>
    </div>

    <div class="furniture-wrapper">
        <div class="bookshelf-container" id="bookshelf">
            <div class="shelf-row" id="shelf-1"></div>
            <div class="shelf-row" id="shelf-2"></div>
            <div class="shelf-row" id="shelf-3"></div>
            <div class="shelf-row" id="shelf-4"></div>
            <div class="shelf-row" id="shelf-5"></div>
            <div class="shelf-row" id="shelf-6"></div>
        </div>
        <div class="shelf-footer">
            <button id="secret-btn" onclick="togglePanel()"></button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'myMangaShelf_PAGINA_B';
        let myBooks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const PIXELS_PER_CM = 5;

        function showStatus(text, isError = false) {
            const el = document.getElementById('status-msg');
            el.innerText = text;
            el.style.display = 'block';
            el.style.background = isError ? '#b71c1c' : '#1b5e20';
            el.style.color = 'white';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function togglePanel() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            renderBookList();
        }

        function saveAndRender() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(myBooks));
            renderShelf();
            renderBookList();
        }

        function addBook() {
            const series = document.getElementById('seriesName').value.trim();
            const vol = parseInt(document.getElementById('volNumber').value) || 0;
            const url = document.getElementById('imgUrl').value.trim();
            let link = document.getElementById('pageLink').value.trim();
            const h_cm = parseFloat(document.getElementById('bookHeightCm').value) || 19;
            const w_cm = parseFloat(document.getElementById('bookWidthCm').value) || 1.5;

            if (!series || !url) { showStatus("Nome e URL são obrigatórios!", true); return; }
            if (link && !link.startsWith('http')) link = 'https://' + link;

            myBooks.push({ series, vol, url, link, h_cm, w_cm, id: Date.now() });
            saveAndRender();
            showStatus("Livro Adicionado!");
        }

        function deleteBook(id) {
            myBooks = myBooks.filter(b => b.id !== id);
            saveAndRender();
        }

        function renderBookList() {
            const list = document.getElementById('active-book-list');
            list.innerHTML = '';
            myBooks.sort((a,b) => a.series.localeCompare(b.series) || a.vol - b.vol);
            myBooks.forEach(b => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `<span>${b.series} #${b.vol}</span><button class="btn-trash" onclick="deleteBook(${b.id})">X</button>`;
                list.appendChild(item);
            });
        }

        // --- NOVO SISTEMA DE BACKUP ---
        function generateBackupCode() {
            try {
                const dataStr = JSON.stringify(myBooks);
                // Usamos btoa com encodeURIComponent para suportar caracteres especiais (acentos)
                const base64 = btoa(encodeURIComponent(dataStr).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
                const textArea = document.getElementById('backupText');
                textArea.value = base64;
                textArea.select();
                navigator.clipboard.writeText(base64);
                showStatus("Código gerado e copiado!");
            } catch (e) {
                showStatus("Erro ao gerar backup", true);
            }
        }

        function restoreBackupCode() {
            const code = document.getElementById('backupText').value.trim();
            if (!code) return showStatus("Cole o código primeiro!", true);
            try {
                const decoded = decodeURIComponent(atob(code).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                const imported = JSON.parse(decoded);
                if (Array.isArray(imported)) {
                    myBooks = imported;
                    saveAndRender();
                    showStatus("Restaurado com sucesso!");
                    document.getElementById('backupText').value = "";
                }
            } catch (e) {
                showStatus("Código inválido ou corrompido!", true);
            }
        }

        function renderShelf() {
            document.querySelectorAll('.shelf-row').forEach(s => s.innerHTML = '');
            myBooks.sort((a,b) => a.series.localeCompare(b.series) || a.vol - b.vol);

            let shelfIndex = 1;
            let currentWidthUsed = 0;
            const shelfMaxWidth = 380; 

            myBooks.forEach(book => {
                const hPx = book.h_cm * PIXELS_PER_CM;
                const wPx = book.w_cm * PIXELS_PER_CM;
                
                const bookEl = document.createElement(book.link ? 'a' : 'div');
                if(book.link) { bookEl.href = book.link; bookEl.target = '_blank'; }
                bookEl.className = book.link ? 'book-link' : 'book';
                
                // Sanitização da URL da imagem para evitar erros de espaço
                const cleanUrl = book.url.replace(/\s/g, '%20');
                bookEl.style.backgroundImage = `url('${cleanUrl}')`;
                bookEl.style.height = `${hPx}px`;
                bookEl.style.width = `${wPx}px`;
                bookEl.setAttribute('data-title', `${book.series} #${book.vol}`);

                if ((currentWidthUsed + wPx) > shelfMaxWidth) {
                    shelfIndex++;
                    currentWidthUsed = 0;
                }

                const shelf = document.getElementById(`shelf-${shelfIndex}`);
                if (shelf) {
                    shelf.appendChild(bookEl);
                    currentWidthUsed += wPx;
                }
            });
        }

        renderShelf();
    </script>
</body>
</html>
